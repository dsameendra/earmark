version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directories:
      - "/Packages/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts/dmg
    schedule:
      interval: monthly
    # The installer layout is verified against pinned dmgbuild behaviour; take major bumps deliberately, not automatically.
    ignore:
      - dependency-name: "dmgbuild"
        update-types: ["version-update:semver-major"]
