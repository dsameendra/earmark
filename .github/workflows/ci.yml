name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, required check: no toolchain needed.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package dependency boundaries
        run: python3 scripts/check-dependencies.py
      - name: Release script tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests
      - name: Website validation
        run: python3 scripts/check-site.py docs
      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: No key material in the repository
        run: bash scripts/check-no-secrets.sh

  # Build and package unit tests. Informational until it has run green a few times: the project targets a very new
  # Xcode/Swift toolchain that hosted runners may not carry yet.
  build-and-test:
    name: build-and-test (macOS)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Build the app (Debug, unsigned)
        run: scripts/check.sh build
      - name: Package unit tests
        run: scripts/check.sh unit
