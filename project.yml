name: Earmark
options:
  bundleIdPrefix: lk.dumindu.earmark
  deploymentTarget:
    macOS: "26.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  AppCore: { path: Packages/AppCore }
  Persistence: { path: Packages/Persistence }
  DesignSystem: { path: Packages/DesignSystem }
  ModelStore: { path: Packages/ModelStore }
  AudioCapture: { path: Packages/AudioCapture }
  Features: { path: Packages/Features }
  Transcription: { path: Packages/Transcription }
  Diarization: { path: Packages/Diarization }
  Processing: { path: Packages/Processing }
  Export: { path: Packages/Export }
  Jobs: { path: Packages/Jobs }
  Permissions: { path: Packages/Permissions }
  LiveCaptions: { path: Packages/LiveCaptions }
  Dictation: { path: Packages/Dictation }
  Meetings: { path: Packages/Meetings }
  Translation: { path: Packages/Translation }
  QwenASR: { path: Packages/QwenASR }
targets:
  Earmark:
    type: application
    platform: macOS
    sources: [App]
    entitlements:
      path: App/Earmark.entitlements
      properties:
        # Not sandboxed; hardened runtime needs the audio-input entitlement for microphone capture.
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Earmark
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Earmark transcribes your microphone audio on this Mac. Nothing leaves your device.
        NSAudioCaptureUsageDescription: Earmark captures meeting and system audio on this Mac for live captions and transcripts. Nothing leaves your device.
    dependencies:
      - package: AppCore
      - package: Persistence
      - package: DesignSystem
      - package: ModelStore
      - package: AudioCapture
      - package: Transcription
      - package: Diarization
      - package: Jobs
      - package: Permissions
      - package: LiveCaptions
      - package: Dictation
      - package: Meetings
      - package: Translation
        product: EarmarkTranslation
      - package: QwenASR
      - package: AppCore
        product: AppCoreTesting   # debug `-UseMocks` composition only
      - package: Features
        product: FeatureShell
      - package: Features
        product: FeatureSupport
      - package: Features
        product: FeatureMenuBar
      - package: Features
        product: FeatureSettings
      - package: Features
        product: FeatureHome
      - package: Features
        product: FeatureQueue
      - package: Features
        product: FeatureLibrary
      - package: Features
        product: FeatureMeetings
      - package: Features
        product: FeatureLive
      - package: Features
        product: FeatureEditor
      - package: Features
        product: FeatureOnboarding
      - package: Processing
      - package: Export
