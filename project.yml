name: Earmark
options:
  bundleIdPrefix: lk.dumindu.earmark
  deploymentTarget:
    macOS: "26.0"
configFiles:
  Debug: Config/Shared.xcconfig
  DebugUI: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
configs:
  Debug: debug
  DebugUI: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.2.2"
    CURRENT_PROJECT_VERSION: "10"
    EARMARK_UPDATE_FEED_URL: ""
    EARMARK_SPARKLE_PUBLIC_KEY: ""
packages:
  AppCore: { path: Packages/AppCore }
  Persistence: { path: Packages/Persistence }
  DesignSystem: { path: Packages/DesignSystem }
  ModelStore: { path: Packages/ModelStore }
  AudioCapture: { path: Packages/AudioCapture }
  Features: { path: Packages/Features }
  Transcription: { path: Packages/Transcription }
  Diarization: { path: Packages/Diarization }
  Processing: { path: Packages/Processing }
  Export: { path: Packages/Export }
  Jobs: { path: Packages/Jobs }
  Permissions: { path: Packages/Permissions }
  LiveCaptions: { path: Packages/LiveCaptions }
  Dictation: { path: Packages/Dictation }
  Meetings: { path: Packages/Meetings }
  Translation: { path: Packages/Translation }
  Intelligence: { path: Packages/Intelligence }
  QwenASR: { path: Packages/QwenASR }
  NLLBNative: { path: Packages/NLLBNative }
  NativeWorkerKit: { path: Packages/NativeWorkerKit }
  TextGenerationNative: { path: Packages/TextGenerationNative }
  ModelFormats: { path: Packages/ModelFormats }
  SpeechNative: { path: Packages/SpeechNative }
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  EarmarkUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      configs:
        DebugUI:
          ENABLE_HARDENED_RUNTIME: NO
      base:
        TEST_TARGET_NAME: Earmark
        PRODUCT_BUNDLE_IDENTIFIER: lk.dumindu.earmark.uitests
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
    dependencies:
      - target: Earmark
  EarmarkNLLBWorker:
    type: tool
    platform: macOS
    sources: [Packages/NLLBNative/Sources/EarmarkNLLBWorker]
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: lk.dumindu.earmark.nllb-worker
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: NLLBNative
        product: NLLBNative
      - package: NativeWorkerKit
  EarmarkTextWorker:
    type: tool
    platform: macOS
    sources: [Packages/TextGenerationNative/Sources/EarmarkTextWorker]
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: lk.dumindu.earmark.text-worker
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/../Frameworks"
    dependencies:
      - package: TextGenerationNative
        product: TextGenerationNative
      - package: NativeWorkerKit
  EarmarkSpeechWorker:
    type: tool
    platform: macOS
    sources: [Packages/SpeechNative/Sources/EarmarkSpeechWorker]
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: lk.dumindu.earmark.speech-worker
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/../Frameworks"
    dependencies:
      - package: SpeechNative
        product: SpeechNative
      - package: SpeechNative
        product: TranscribeCpp
      - package: NativeWorkerKit
  Earmark:
    type: application
    platform: macOS
    sources: [App]
    settings:
      configs:
        DebugUI:
          PRODUCT_BUNDLE_IDENTIFIER: lk.dumindu.earmark.uihost
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ENABLE_HARDENED_RUNTIME: NO
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: Earmark
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/Earmark.entitlements
      properties:
        # Not sandboxed; hardened runtime needs the audio-input entitlement for microphone capture.
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Earmark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        SUFeedURL: $(EARMARK_UPDATE_FEED_URL)
        SUPublicEDKey: $(EARMARK_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        NSMicrophoneUsageDescription: Earmark transcribes your microphone audio on this Mac. Nothing leaves your device.
        NSAudioCaptureUsageDescription: Earmark captures meeting and system audio on this Mac for live captions and transcripts. Nothing leaves your device.
    dependencies:
      - target: EarmarkNLLBWorker
        embed: false
      - target: EarmarkTextWorker
        embed: false
      - target: EarmarkSpeechWorker
        embed: false
      - package: Sparkle
      - package: AppCore
      - package: Persistence
      - package: DesignSystem
      - package: ModelStore
      - package: AudioCapture
      - package: Transcription
      - package: Diarization
      - package: Jobs
      - package: Permissions
      - package: LiveCaptions
      - package: Dictation
      - package: Meetings
      - package: Translation
        product: EarmarkTranslation
      - package: Intelligence
        product: EarmarkIntelligence
      - package: QwenASR
      - package: AppCore
        product: AppCoreTesting   # debug `-UseMocks` composition only
      - package: Features
        product: FeatureShell
      - package: Features
        product: FeatureWorkspace
      - package: Features
        product: FeatureSupport
      - package: Features
        product: FeatureMenuBar
      - package: Features
        product: FeatureSettings
      - package: Features
        product: FeatureHome
      - package: Features
        product: FeatureQueue
      - package: Features
        product: FeatureLibrary
      - package: Features
        product: FeatureMeetings
      - package: Features
        product: FeatureLive
      - package: Features
        product: FeatureEditor
      - package: Features
        product: FeatureOnboarding
      - package: Processing
      - package: Export
    postBuildScripts:
      - name: Embed native translation worker
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$destination"
          frameworks="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Frameworks"
          mkdir -p "$frameworks"
          /usr/bin/ditto "$SRCROOT/Packages/TextGenerationNative/Vendor/EarmarkLlama.xcframework/macos-arm64/EarmarkLlama.framework" "$frameworks/EarmarkLlama.framework"
          /usr/bin/ditto "$SRCROOT/Packages/SpeechNative/Vendor/TranscribeCpp.xcframework/macos-arm64/CTranscribe.framework" "$frameworks/CTranscribe.framework"
          for helper in EarmarkNLLBWorker EarmarkTextWorker EarmarkSpeechWorker; do
            /usr/bin/ditto "$BUILT_PRODUCTS_DIR/$helper" "$destination/$helper"
          done
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            for code in "$frameworks/EarmarkLlama.framework" "$frameworks/CTranscribe.framework" "$destination/EarmarkNLLBWorker" "$destination/EarmarkTextWorker" "$destination/EarmarkSpeechWorker"; do
              if [ "$EXPANDED_CODE_SIGN_IDENTITY" = "-" ]; then
                /usr/bin/codesign --force --sign - --options runtime --timestamp=none "$code"
              else
                /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$code"
              fi
            done
          fi

schemes:
  Earmark:
    build:
      targets:
        Earmark: all
        EarmarkUITests: [test]
    test:
      targets: [EarmarkUITests]
      gatherCoverageData: false
      config: DebugUI
  Earmark-QA:
    build:
      targets:
        Earmark: all
        EarmarkUITests: [test]
    test:
      targets: [EarmarkUITests]
      gatherCoverageData: false
      config: DebugUI
