<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earmark Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Noto+Sans+Sinhala:wght@400;600&display=swap">
<style>
body{margin:0}
.gl{background:rgba(255,252,247,.58);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 10px 28px rgba(60,40,20,.12)}
</style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#1C1B18;background:radial-gradient(900px 600px at 10% 5%,rgba(196,75,22,.16),transparent 60%),radial-gradient(800px 600px at 95% 95%,rgba(27,122,116,.12),transparent 60%),#F3EEE5">
<div style="position:absolute;left:12px;top:12px;bottom:12px;width:232px"><dc-import name="Sidebar" active="Home" hint-size="232px,876px"></dc-import></div>

<div style="position:absolute;left:256px;right:12px;top:12px;bottom:12px;display:flex;flex-direction:column;gap:12px">
<div style="height:44px;display:flex;align-items:center;gap:12px;padding:0 6px 0 4px;flex:none">
<div style="font-size:15px;font-weight:600;flex:1">Home</div>
<div style="display:flex;align-items:center;gap:8px;height:32px;width:300px;border-radius:16px;background:rgba(28,27,24,.06);padding:0 12px;font-size:13px;color:#6B675D"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4.5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM15 15l5 5" stroke="#6B675D" stroke-width="1.6"/><path d="M8 10.5h5" stroke="#C44B16" stroke-width="2.1"/></svg><span style="flex:1">Search transcripts</span><span style="font-size:11px;border:1px solid rgba(28,27,24,.15);border-radius:5px;padding:0 5px">⌘K</span></div>
<div style="height:34px;border-radius:17px;background:#C44B16;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;padding:0 16px;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 10px rgba(196,75,22,.3)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4"/></svg>Transcribe</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:14px;min-height:0">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;flex:none">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<div style="background:#FCFAF6;box-shadow:0 0 0 1px rgba(28,27,24,.08),0 8px 22px rgba(60,40,20,.07);border-radius:24px;padding:20px;height:158px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden">
<div style="width:44px;height:44px;border-radius:14px;background:#F7E4D8;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.p}}" stroke="#1C1B18" stroke-width="1.6"/><path d="{{a.a}}" stroke="#C44B16" stroke-width="2.1"/></svg></div>
<div><div style="font-size:16px;font-weight:600">{{a.t}}</div><div style="font-size:12.5px;color:#5A564E;margin-top:3px">{{a.s}}</div></div>
<span style="position:absolute;right:16px;top:18px;font-size:11px;font-weight:600;color:#5A564E;border:1px solid rgba(28,27,24,.15);border-radius:6px;padding:1px 6px">{{a.k}}</span>
</div>
</sc-for>
</div>

<div style="flex:1;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;min-height:0">
<div style="background:#FCFAF6;border-radius:26px;box-shadow:0 0 0 1px rgba(28,27,24,.08),0 12px 30px rgba(60,40,20,.08);padding:26px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-family:Newsreader,serif;font-size:28px;letter-spacing:-.02em">Recent</div><div style="font-size:13px;color:#C44B16;font-weight:500">Library</div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<div style="border-radius:18px;background:#F7F3EB;padding:16px;display:flex;flex-direction:column;gap:8px;height:150px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#6B675D;font-variant-numeric:tabular-nums"><span>{{c.m}}</span><span style="font-weight:600;background:#EDE5D6;border-radius:9px;padding:1px 8px;color:#5A564E;font-family:-apple-system,'Noto Sans Sinhala',sans-serif">{{c.l}}</span></div>
<div style="font-size:15px;font-weight:600">{{c.t}}</div>
<div style="font-family:Newsreader,serif;font-size:15px;line-height:1.45;color:#3A372F;overflow:hidden">{{c.q}}</div>
</div>
</sc-for>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="background:#FCFAF6;box-shadow:0 0 0 1px rgba(28,27,24,.08),0 12px 30px rgba(60,40,20,.08);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;flex:1">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:15px;font-weight:600">Working on</div><span style="font-size:11px;font-weight:600;color:#C44B16;background:#F7E4D8;border-radius:9px;padding:2px 9px">11× real time</span></div>
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="2">
<div><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:500">{{j.t}}</span><span style="color:#5A564E;font-variant-numeric:tabular-nums">{{j.p}}%</span></div><div style="height:6px;border-radius:3px;background:rgba(28,27,24,.1);margin-top:7px"><div style="height:6px;border-radius:3px;background:linear-gradient(90deg,#E8794A,#C44B16);width:{{j.p}}%"></div></div></div>
</sc-for>
<div style="margin-top:auto;border-top:1px solid rgba(28,27,24,.1);padding-top:12px;font-size:12.5px;color:#5A564E;line-height:1.5"><b style="color:#1C1B18">Whisper large-v3 turbo</b> is ready. English, Sinhala and 97 more, all on this Mac.</div>
</div>
<div style="border-radius:26px;border:1.5px dashed rgba(196,75,22,.5);background:#FDF4EC;padding:18px;display:flex;align-items:center;gap:12px;font-size:13.5px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13.5V18a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4.5" stroke="#1C1B18" stroke-width="1.6"/><path d="M12 15V4.5M8 8.4l4-3.9 4 3.9" stroke="#C44B16" stroke-width="2.1"/></svg><span><b>Drop files anywhere</b><br><span style="color:#5A564E">to start transcribing</span></span></div>
</div>
</div>
</div>
</div>
</div>
</x-dc>

</body>
</html>
