<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earmark icon balance options</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1440px;height:700px;box-sizing:border-box;background:#F3EEE5;color:#1C1B18;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;padding:44px 64px;display:flex;flex-direction:column;gap:24px">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8794A"/><stop offset=".55" stop-color="#C44B16"/><stop offset="1" stop-color="#8F360E"/></linearGradient>
<linearGradient id="gN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2B27"/><stop offset="1" stop-color="#11100E"/></linearGradient>
<linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4EA"/><stop offset="1" stop-color="#F0BC9F"/></linearGradient>
<linearGradient id="gFN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB48C"/><stop offset="1" stop-color="#D4602A"/></linearGradient>
<clipPath id="cl"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z"/></clipPath>
</defs></svg>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:40px">
<div><div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6B675D;font-weight:600">Step 2b of 6 — Ember locked · balance the icon</div>
<div style="font-family:Newsreader,serif;font-size:44px;line-height:1.05;letter-spacing:-.025em;margin-top:8px">The fold crowds the corner. Give the ear room to the left.</div></div>
<div style="max-width:400px;font-size:13.5px;line-height:1.55;color:#5A564E">Dashed lines mark the true centre. Offsets are a percentage of tile width, moving left and 1% down. Locked: B, left 2.5%.</div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1">
<sc-for list="{{vars}}" as="v" hint-placeholder-count="3">
<div style="background:#FCFAF6;border:1px solid rgba(28,27,24,.12);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:12px;align-items:center;justify-content:center">
<svg viewBox="-6 -4 112 118" width="168" height="177" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z" fill="url(#gE)" style="filter:drop-shadow(0 10px 14px rgba(110,45,10,.35))"/><g transform="{{v.tf}}"><path d="M30 8c-9 0-16 7-16 16v6c0 5 3 7 6 10 2 2 3 4 3 7a6 6 0 0 0 11 3M30 20c-4 0-7 3-7 7" fill="none" stroke="#FFFCF6" stroke-width="4.8"/><path d="M44 20a15 15 0 0 1 0 20" fill="none" stroke="#FFD7BF" stroke-width="4.2"/></g><g clip-path="url(#cl)"><path d="M72 0H100V28Z" fill="rgba(70,20,0,.38)"/><path d="M72 0V24a4 4 0 0 0 4 4H100Z" fill="url(#gF)" style="filter:drop-shadow(-1.5px 2px 2px rgba(50,15,0,.35))"/><path d="M72 0L100 28" stroke="rgba(255,255,255,.7)" stroke-width=".9" fill="none"/></g><path d="M50 -2V102M-2 50H102" stroke="rgba(255,255,255,.5)" stroke-width=".5" stroke-dasharray="2 2" fill="none"/></svg>
<div style="display:flex;flex-direction:column;gap:14px;align-items:center">
<svg viewBox="0 0 100 100" width="64" height="64" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z" fill="url(#gE)"/><g transform="{{v.tf}}"><path d="M30 8c-9 0-16 7-16 16v6c0 5 3 7 6 10 2 2 3 4 3 7a6 6 0 0 0 11 3M30 20c-4 0-7 3-7 7" fill="none" stroke="#FFFCF6" stroke-width="5"/><path d="M44 20a15 15 0 0 1 0 20" fill="none" stroke="#FFD7BF" stroke-width="4.6"/></g><g clip-path="url(#cl)"><path d="M72 0H100V28Z" fill="rgba(70,20,0,.38)"/><path d="M72 0V24a4 4 0 0 0 4 4H100Z" fill="url(#gF)"/></g></svg>
<svg viewBox="0 0 100 100" width="32" height="32" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z" fill="url(#gE)"/><g transform="{{v.tf}}"><path d="M30 8c-9 0-16 7-16 16v6c0 5 3 7 6 10 2 2 3 4 3 7a6 6 0 0 0 11 3M30 20c-4 0-7 3-7 7" fill="none" stroke="#FFFCF6" stroke-width="5.6"/><path d="M44 20a15 15 0 0 1 0 20" fill="none" stroke="#FFD7BF" stroke-width="5.2"/></g><g clip-path="url(#cl)"><path d="M72 0H100V28Z" fill="rgba(70,20,0,.38)"/><path d="M72 0V24a4 4 0 0 0 4 4H100Z" fill="url(#gF)"/></g></svg>
<svg viewBox="0 0 100 100" width="64" height="64" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z" fill="url(#gN)"/><g transform="{{v.tf}}"><path d="M30 8c-9 0-16 7-16 16v6c0 5 3 7 6 10 2 2 3 4 3 7a6 6 0 0 0 11 3M30 20c-4 0-7 3-7 7" fill="none" stroke="#F3EFE7" stroke-width="5"/><path d="M44 20a15 15 0 0 1 0 20" fill="none" stroke="#F28A57" stroke-width="4.6"/></g><g clip-path="url(#cl)"><path d="M72 0H100V28Z" fill="rgba(0,0,0,.5)"/><path d="M72 0V24a4 4 0 0 0 4 4H100Z" fill="url(#gFN)"/></g></svg>
</div>
</div>
<div><div style="font-size:15px;font-weight:600">{{v.name}}</div><div style="font-size:12.5px;line-height:1.5;color:#5A564E;margin-top:3px">{{v.why}}</div></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return { vars:[
 {name:'A · Centred · 0%',why:'Geometric centre. The thin sound arc drifts toward the curl, so the mark feels pushed into the corner.',tf:'translate(14.5 15) scale(1.15)'},
 {name:'B · Left 2.5% · LOCKED',why:'Chosen. A light correction that keeps the ear close to the centre while easing it off the fold.',tf:'translate(12 16) scale(1.15)'},
 {name:'C · Left 6%',why:'Clear space around the fold, but the ear starts to look parked on the left edge.',tf:'translate(8.5 16) scale(1.15)'},
 {name:'D · Left 4%',why:'Considered, not chosen. Slightly more clearance around the fold.',tf:'translate(10.5 16) scale(1.15)'}
] };
}
}
</script>
</body>
</html>
