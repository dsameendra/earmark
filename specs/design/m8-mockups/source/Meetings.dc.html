<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earmark meetings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap">
<style>
body{margin:0}
.gl{background:rgba(255,252,247,.58);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 10px 28px rgba(60,40,20,.12)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.pl{position:absolute;inset:0;border-radius:50%;background:#D1352B;animation:pulse 2s cubic-bezier(.2,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){.pl{animation:none}}
</style>
</helmet>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:#1C1B18;background:radial-gradient(900px 600px at 10% 5%,rgba(196,75,22,.14),transparent 60%),radial-gradient(800px 600px at 95% 95%,rgba(27,122,116,.1),transparent 60%),#F3EEE5">
<div style="position:absolute;left:12px;top:12px;bottom:12px;width:232px"><dc-import name="Sidebar" active="Meetings" hint-size="232px,876px"></dc-import></div>
<div style="position:absolute;left:256px;right:12px;top:12px;bottom:12px;display:flex;flex-direction:column;gap:12px">
<div style="height:44px;display:flex;align-items:center;gap:12px;padding:0 6px 0 4px;flex:none">
<div style="font-size:17px;font-weight:600;flex:1">Meetings</div>
<div class="gl" style="display:flex;gap:2px;padding:4px;border-radius:22px;font-size:13px;font-weight:500">
<div style="height:32px;border-radius:16px;padding:0 14px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.7)">Zoom · Ask first</div>
<div style="height:32px;border-radius:16px;padding:0 14px;display:flex;align-items:center;color:#5A564E">Teams · Ask first</div>
</div>
</div>
<div style="flex:1;background:#FCFAF6;border-radius:26px;box-shadow:0 0 0 1px rgba(28,27,24,.08),0 12px 30px rgba(60,40,20,.08);padding:28px 36px;display:flex;flex-direction:column;gap:20px;overflow:hidden">
<div style="border-radius:22px;background:#FDF1E8;box-shadow:0 0 0 1px rgba(196,75,22,.25);padding:22px 24px;display:flex;align-items:center;gap:20px">
<div style="position:relative;width:14px;height:14px;flex:none"><div class="pl"></div><div style="position:absolute;inset:0;border-radius:50%;background:#D1352B"></div></div>
<div style="flex:1"><div style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#9E3A10;font-weight:600">Zoom meeting detected</div><div style="font-family:Newsreader,serif;font-size:26px;letter-spacing:-.02em;margin-top:2px">Design review — Q4 planning</div><div style="font-size:13px;color:#5A564E;margin-top:3px">Started 2 minutes ago · 4 participants · nothing is recorded until you choose</div></div>
<div style="display:flex;gap:10px"><div style="height:36px;border-radius:18px;padding:0 18px;display:flex;align-items:center;font-size:13.5px;font-weight:600;background:#fff;box-shadow:0 0 0 1px rgba(28,27,24,.12)">Dismiss</div><div style="height:36px;border-radius:18px;padding:0 18px;display:flex;align-items:center;font-size:13.5px;font-weight:600;background:#fff;box-shadow:0 0 0 1px rgba(28,27,24,.12)">Transcribe</div><div style="height:36px;border-radius:18px;padding:0 20px;display:flex;align-items:center;font-size:13.5px;font-weight:600;background:#C44B16;color:#fff">Transcribe and record</div></div>
</div>
<div style="font-family:Newsreader,serif;font-size:26px;letter-spacing:-.02em">Earlier</div>
<div style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{meets}}" as="m" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:18px;padding:12px 14px;border-radius:16px;background:{{m.bg}}">
<div style="width:92px;height:56px;border-radius:12px;background:{{m.th}};flex:none;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box"><span style="font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.4);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums">{{m.len}}</span></div>
<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">{{m.t}}</div><div style="font-size:12.5px;color:#6B675D;margin-top:3px">{{m.d}} · {{m.p}} speakers · {{m.tr}}</div></div>
<span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:{{m.bb}};color:{{m.bc}}">{{m.a}}</span>
<div style="display:flex;gap:7px;color:#5A564E;font-size:12.5px;align-items:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-label="Video recorded" role="img"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h8.5A1.5 1.5 0 0 1 15 7.5v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16.5z" stroke="#1C1B18" stroke-width="1.6"/><path d="M15 10.5l5.5-3v9l-5.5-3z" stroke="#C44B16" stroke-width="2.1"/></svg></div>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const z={a:'Zoom',bb:'#E1EBFB',bc:'#1F4E9E'}, t={a:'Teams',bb:'#E7E4F7',bc:'#4B3FA5'};
const m=(t_,d,p,len,tr,th,src,bg)=>({t:t_,d,p,len,tr,th,bg:bg||'transparent',...src});
return { meets:[
 m('Weekly product sync','Yesterday, 10:00',4,'1:02:40','Mic + system audio, video','linear-gradient(135deg,#3B4A5C,#1F2833)',z),
 m('Design review, Teams','Wed, 14:30',3,'38:48','Mic + system audio','linear-gradient(135deg,#6B5B95,#3C3358)',t),
 m('Budget call','Tue, 09:15',2,'38:48','Mic + system audio, video','linear-gradient(135deg,#3F6B5E,#1E3B33)',z),
 m('Candidate interview','Mon, 16:00',2,'45:02','Mic only','linear-gradient(135deg,#8B6B4A,#4B3724)',z),
 m('Retro — sprint 41','Nov 14, 11:00',6,'52:20','Mic + system audio','linear-gradient(135deg,#5B6B7A,#2E3944)',t)
] };
}
}
</script>
</body>
</html>
