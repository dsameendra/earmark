<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earmark sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:100%;height:100%;box-sizing:border-box;border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;gap:4px;font-family:Inter,system-ui,sans-serif;position:relative;{{panel}}">
<div style="display:flex;gap:8px;padding:4px 8px 14px"><span style="width:12px;height:12px;border-radius:50%;background:#FF5F57"></span><span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E"></span><span style="width:12px;height:12px;border-radius:50%;background:#28C840"></span></div>
<div style="display:flex;align-items:center;gap:9px;padding:0 10px 14px">
<svg viewBox="0 0 100 100" width="28" height="28" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="sbG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8794A"/><stop offset=".55" stop-color="#C44B16"/><stop offset="1" stop-color="#8F360E"/></linearGradient><linearGradient id="sbF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4EA"/><stop offset="1" stop-color="#F0BC9F"/></linearGradient><clipPath id="sbC"><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z"/></clipPath></defs><path d="M22 0H78a22 22 0 0 1 22 22V78a22 22 0 0 1-22 22H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0Z" fill="url(#sbG)"/><g transform="translate(12 16) scale(1.15)"><path d="M30 8c-9 0-16 7-16 16v6c0 5 3 7 6 10 2 2 3 4 3 7a6 6 0 0 0 11 3M30 20c-4 0-7 3-7 7" fill="none" stroke="#FFFCF6" stroke-width="6"/><path d="M44 20a15 15 0 0 1 0 20" fill="none" stroke="#FFD7BF" stroke-width="5.5"/></g><g clip-path="url(#sbC)"><path d="M72 0H100V28Z" fill="rgba(70,20,0,.38)"/><path d="M72 0V24a4 4 0 0 0 4 4H100Z" fill="url(#sbF)"/></g></svg>
<span style="font-family:Newsreader,serif;font-size:22px;letter-spacing:-.02em;color:{{ink}}">earmark</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:14px;font-size:14px;{{it.row}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.p}}" stroke="{{it.ik}}" stroke-width="1.6"/><path d="{{it.a}}" stroke="{{it.ia}}" stroke-width="2.1"/></svg>
<span style="flex:1">{{it.n}}</span>
<span style="font-size:11px;font-weight:600;min-width:18px;text-align:center;border-radius:9px;padding:1px 6px;color:{{ac}};background:{{acs}};{{it.badge}}">{{it.b}}</span>
</div>
</sc-for>
<div style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:{{ink3}};padding:18px 12px 6px">Folders</div>
<sc-for list="{{folders}}" as="f" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:13.5px;color:{{ink2}}"><span style="width:8px;height:8px;border-radius:50%;background:{{f.c}}"></span>{{f.n}}</div>
</sc-for>
<div style="flex:1"></div>
<div style="margin:0 4px;padding:10px 12px;border-radius:16px;background:{{chip}};display:flex;flex-direction:column;gap:6px;font-size:12px;color:{{ink2}}">
<div style="display:flex;justify-content:space-between;color:{{ink}};font-weight:600"><span>Whisper large-v3 turbo</span><span style="color:#2F7A4F">Ready</span></div>
<div style="height:4px;border-radius:2px;background:{{track}}"><div style="width:100%;height:4px;border-radius:2px;background:{{ac}}"></div></div>
<span>On this Mac · 1.6 GB</span>
</div>
<div style="display:flex;align-items:center;gap:11px;padding:8px 14px;font-size:14px;color:{{ink2}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h9.8M17.6 8H20M4 16h2.4M10.2 16H20" stroke="{{ink2}}" stroke-width="1.6"/><path d="M13.8 8a1.9 1.9 0 1 0 3.8 0 1.9 1.9 0 1 0-3.8 0zM6.4 16a1.9 1.9 0 1 0 3.8 0 1.9 1.9 0 1 0-3.8 0z" stroke="{{ink2}}" stroke-width="1.6"/></svg>Settings</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"active":{"editor":"text","default":"Home"},"$preview":{"width":232,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const dk = !!this.props.dark;
const active = this.props.active ?? 'Home';
const ink = dk ? '#F3EFE7' : '#1C1B18';
const ink2 = dk ? '#B5B0A5' : '#5A564E';
const ink3 = dk ? '#9A9589' : '#6B675D';
const ac = dk ? '#F28A57' : '#C44B16';
const acs = dk ? 'rgba(242,138,87,.16)' : '#F7E4D8';
const panel = dk
 ? 'background:rgba(48,44,38,.55);-webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.12);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 18px 44px rgba(0,0,0,.45)'
 : 'background:rgba(255,252,247,.55);-webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 44px rgba(60,40,20,.14)';
const defs = [
['Home','M4 11.2 12 4.5l8 6.7V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z','M10 20v-4.5h4V20',''],
['Queue','M5 7h9M5 12h14M5 17h7','M19 7h.01','3'],
['Meetings','M3.8 19c.5-3 2.8-4.8 5.2-4.8s4.7 1.8 5.2 4.8M9 11.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z','M15.5 5.6a2.6 2.6 0 0 1 0 5M17.6 14.6c1.6.6 2.7 2 3 4.2',''],
['Live','M4 6h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-7l-4 3.5V16H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z','M7 10h4M7 13h8',''],
['Library','M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z','M14 3v4h4','248'],
['Recently Deleted','M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.8 12a1 1 0 0 0 1 .9h7.4a1 1 0 0 0 1-.9l.8-12','M12 16v-5M9.8 13l2.2-2.2 2.2 2.2','']
];
const items = defs.map(([n,p,a,b]) => {
 const on = n === active;
 const row = on
  ? 'font-weight:600;color:'+ink+';'+(dk?'background:rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px rgba(0,0,0,.3)':'background:rgba(255,252,246,.85);box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(60,40,20,.12)')
  : 'color:'+ink2;
 return { n,p,a,b, row, ik: on?ink:ink2, ia: on?ac:ink2, badge: b ? '' : 'display:none' };
});
return { items, panel, ink, ink2, ink3, ac, acs,
 logoInk: ink, logoBar: dk?'#1C1B18':'#FCFAF6',
 chip: dk?'rgba(255,255,255,.07)':'rgba(255,255,255,.5)', track: dk?'rgba(255,255,255,.12)':'rgba(28,27,24,.1)',
 folders:[{n:'Interviews',c:'#C44B16'},{n:'Meetings 2026',c:'#1B7A74'},{n:'Sinhala lessons',c:'#5558D6'}] };
}
}
</script>
</body>
</html>
